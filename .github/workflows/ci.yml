name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the tests import; torch is too heavy to install on every run
      - run: pip install $(grep -E '^pandas==' requirements.txt) -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
